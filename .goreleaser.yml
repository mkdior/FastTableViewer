version: 2

project_name: ftv

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - binary: ftv
    main: ./cmd/ftv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

nfpms:
  - maintainer: mkdior
    description: "Fast, feature-rich CSV/TSV/delimited file viewer for the command line"
    homepage: https://github.com/mkdior/FastTableViewer
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
